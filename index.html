
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lupa Social - UPMM</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              u_brown_dark: '#2C2928',
              u_brown_mid: '#5D5755',
              u_brown_light: '#8C8481',
              u_yellow: '#FFC107',
              u_bg: '#F9F7F2',
            },
            animation: {
              fadeIn: 'fadeIn 0.5s ease-out forwards',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #F9F7F2;
      }
      .custom-scrollbar::-webkit-scrollbar { width: 4px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: #F1F1F1; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #8C8481; border-radius: 10px; }
      
      /* Estilos para o Markdown renderizado */
      .prose h1, .prose h2, .prose h3 { color: #FFC107 !important; font-weight: 900 !important; text-transform: uppercase; letter-spacing: -0.025em; margin-top: 1.5rem !important; margin-bottom: 0.75rem !important; }
      .prose p { color: rgba(249, 247, 242, 0.9) !important; margin-bottom: 1rem !important; line-height: 1.6; }
      .prose strong { color: #FFC107 !important; font-weight: 700; }
      .prose ul { list-style-type: none !important; padding-left: 0 !important; }
      .prose li { position: relative; padding-left: 1.5rem; margin-bottom: 0.5rem; color: rgba(249, 247, 242, 0.9) !important; }
      .prose li::before { content: "→"; position: absolute; left: 0; color: #FFC107; font-weight: 900; }
      .prose hr { border-color: rgba(255, 255, 255, 0.1) !important; margin: 2rem 0 !important; }
    </style>
  <script type="importmap">

  "imports": {
    "recharts": "https://esm.sh/recharts@^3.7.0",

    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "papaparse": "https://esm.sh/papaparse@^5.4.1",
    "marked": "https://esm.sh/marked@15.0.0"
  }
}
</script>
